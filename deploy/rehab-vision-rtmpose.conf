# systemd drop-in for rehab-vision.service; only after prepare-rtmpose.sh passes.
[Service]
ExecStart=
ExecStart=/opt/rehabtrack/.vision-venv/bin/python algorithm/rehab-pose-demo/live_api.py
Environment=REHAB_VISION_REMOTE_RTMPOSE=on
Environment=REHAB_VISION_AUTH=on
Environment=REHAB_VISION_MAX_SESSIONS=8
# 公网默认改为浏览器识别（2026-11-25）：多数会话只收关键点、很轻，上限放到 8。
# 服务器识别（?vision=remote）每个会话都要跑模型，多人同时用会拖慢，仍只建议单人演示。
MemoryMax=1200M
CPUQuota=180%
TasksMax=128
